[package]
name = "llmium"
version = "0.1.0"
edition = "2021"
description = "Evidence-driven open-weight checkpoint assessment"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
half = "2"
memmap2 = "0.9"
safetensors = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tiny_http = "0.12"
url = "2"
