[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmium"
version = "0.1.0"
description = "Evidence-driven open-weight checkpoint assessment"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "safetensors>=0.5", "huggingface_hub>=0.30"]

[project.scripts]
llmium = "llmium.cli:main"

[tool.setuptools.package-data]
llmium = ["web/*.html"]
